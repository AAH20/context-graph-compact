[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "context-graph-compact"
version = "0.1.0"
description = "Self-Evolving Lossless Hierarchical DAG Context Compactor & Hebbian Synapse Long-Term Memory Engine for AI Agents"
authors = [
    { name = "Ahmed Hassan", email = "ahmed.alaa.hassan25@gmail.com" }
]
license = { text = "MIT OR Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "typing_extensions>=4.8.0",
]
